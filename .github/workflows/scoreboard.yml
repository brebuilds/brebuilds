name: scoreboard

on:
  schedule:
    - cron: "17 9 * * *" # nightly, ~4am Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch stats and render card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::warning::STATS_TOKEN secret not set; keeping the last committed scoreboard."
            exit 0
          fi
          node scripts/scoreboard.mjs
      - name: Commit if changed
        run: |
          git config user.name "scoreboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || (git commit -m "chore: refresh scoreboard" && git push)
